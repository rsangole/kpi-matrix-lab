[project]
name = "kpi-matrix-lab"
version = "0.1.0"
description = "Interactive synthetic KPI matrix profile laboratory"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "plotly>=5.20,<7",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
